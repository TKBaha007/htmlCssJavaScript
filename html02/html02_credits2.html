<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE RECIPES</title>
  <style>
    :root {
      --bg-deep: #0a0505;
      --bg-panel: #140808;
      --bg-aside: #1c0b0b;
      --neon-gold: #ffb700;
      --neon-amber: #ff6a00;
      --neon-blood: #ff1e00;
      --neon-dim: #5c1d1d;
    }

    body {
      font-family: 'Impact', 'Arial Black', sans-serif, sans-serif;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 106, 0, 0.15) 0%, transparent 60%),
        linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(20, 8, 8, 0.5) 50%);
      background-size: 100% 100%, 100% 4px;
      color: var(--neon-gold);
      margin: 0;
      padding: 20px;
      letter-spacing: 0.5px;
    }

    .page-wrapper {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--bg-panel);
      padding: 30px;
      border-radius: 0px;
      border: 2px solid var(--neon-amber);
      box-shadow: 
        0 0 25px rgba(255, 106, 0, 0.4), 
        inset 0 0 30px rgba(255, 30, 0, 0.15);
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    li {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #e0d0d0;
      background-color: var(--bg-aside);
      padding: 15px;
      margin-bottom: 12px;
      border-left: 4px solid var(--neon-blood);
      border-right: 1px solid var(--neon-dim);
      border-top: 1px solid var(--neon-dim);
      border-bottom: 1px solid var(--neon-dim);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    li:last-child {
      margin-bottom: 0;
    }

    li strong {
      color: var(--neon-gold);
      text-shadow: 0 0 5px rgba(255, 183, 0, 0.4);
      display: block;
      font-size: 1.2rem;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <main>
      <section>
        <ul>
          <li><strong>Drink 1:</strong>Dr. Peper</li>
          <li><strong>Drink 2:</strong>Sprite</li>
          <li><strong>drink 3:</strong>Pepsi </li>
          <li><strong>Drink 1:</strong>Water with your choice of lime or lemon</li>
          <li><strong>Drink 2:</strong>Rootbeer</li>
          <li><strong>drink 3:</strong>Lemonade </li>
        </ul>
      </section>
    </main>
  </div>

</body>
</html>
