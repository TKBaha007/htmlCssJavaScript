const bannedPlaylistItems = ['playlists', 'save', 'add to queue', 'save to playlist', 'save to watch later', 'share', 'download'];
const bannedPlayableItems = ['playables'];

let observer, prevURL;

// //
// configure youtube mutation observer
function configure() {
  const style = document.createElement('STYLE');
  style.type = 'text/css';
  style.innerText = '';

  if (false) {
    console.debug('[LS Filter] hide sidebar');
    style.innerText += '.watch-sidebar, .ytd-watch-next-secondary-results-renderer {display: none !important;}\n';
  }

  if (true) {
    console.debug('[LS Filter] hide comments');
    style.innerText += '#watch-discussion, .watch-discussion, ytd-comments {display: none !important;}\n';
  }

  if (style.innerText !== '') {
    let head = document.getElementsByTagName('head');
    if (head && head.length > 0) {
      head = head[0];
      head.append(style);
    }
  }

  if (typeof(observer) !== 'undefined') {
    observer.disconnect();
  }

  prevURL = window.location.href;

  observer = new MutationObserver(() => {
    const currentURL = window.location.href;

    if (currentURL !== prevURL) {
      console.debug('[LS Filter] URL changed, scoring ->', currentURL);
      prevURL = currentURL;
      scoreUrl({ type: 'youtube', url: currentURL }, false);
    }

    processMutates();
  })

  observer.observe(document, {subtree: true, childList: true});

  // Add click listener to catch menu opens
  document.addEventListener('click', (e) => {
    // Delay slightly to let the menu render
    setTimeout(() => {
      if (false) {
        hidePlaylists();
      }
    }, 50);
  }, true);
}

// //
// process youtube mutations
function processMutates() {
  // stop auto play
  if (false) {
    killYTAutoplay();
  }

  // hide playables
  if (false) {
    hidePlayables();
  }

  // hide playlists
  if (false) {
    hidePlaylists();
  }

  // hide shorts
  if (false) {
    hideShorts();
  }

  // block thumbnails
  if (false) {
    hideYTAvatars();
  }

  // hide live chat
  if (!false) {
    hideLiveChat();
  }

  // stop miniplayers (hover preview)
  killMiniPlayers();

  // score embed
  scoreEmbed();
}

// //
// hide avatars
function hideYTAvatars() {
  document.querySelectorAll('yt-decorated-avatar-view-model, #avatar').forEach((e) => {
    [...e.getElementsByTagName('img')].forEach((i) => {
      if (!i.src.match(blockImg) && i.src.startsWith('https://')) {
        console.debug('[LS Filter] hiding thumbnail ->', i.src);
        i.src = blockImg;
      }
    });
  });
}

// //
// hide playables
function hidePlayables() {
  // Remove from ytd-menu-service-item-renderer
  document.querySelectorAll('ytd-guide-entry-renderer').forEach(item => {
    const label = item.querySelector('yt-formatted-string');
    if (label && bannedPlayableItems.includes(label.textContent.trim().toLowerCase())) {
      console.debug('[LS Filter] hiding playable item ->', label.textContent.trim());
      item.remove();
    }
  });
}

// //
// prevent autoplay if domain is a youtube and paths match user/channel/c/featured/@
function killYTAutoplay() {
  const url = new URL(window.location.href);
  const channelLikePath = /^\/(?:(?:user|channel|c)\/[^/?]+(?:\/featured)?|@[^/?]+(?:\/featured)?)$/;
  if (url.hostname.endsWith('youtube.com') && channelLikePath.test(url.pathname)) {
    pauseVideo();
  }
}

// //
// hide playlists
function hidePlaylists() {
  console.debug('[LS Filter] checking playlists');

  // Remove from ytd-menu-service-item-renderer
  document.querySelectorAll('ytd-guide-entry-renderer, ytd-menu-service-item-renderer, ytd-menu-navigation-item-renderer, ytd-menu-service-item-download-renderer').forEach(item => {
    const label = item.querySelector('yt-formatted-string');
    if (label && bannedPlaylistItems.includes(label.textContent.trim().toLowerCase())) {
      console.debug('[LS Filter] hiding playlist item ->', label.textContent.trim());
      item.remove();
    }
  });

  // Remove playlist tabs
  document.querySelectorAll('yt-tab-shape[tab-title="Playlists"]').forEach(tab => {
    console.debug('[LS Filter] hiding playlist tab');
    tab.remove();
  });

  // Remove from yt-list-item-view-model (old and new YouTube UIs)
  document.querySelectorAll('yt-list-item-view-model').forEach(item => {
    const iText = item.innerText.trim().toLowerCase();
    if (bannedPlaylistItems.includes(iText)) {
      console.debug('[LS Filter] hiding playlist item ->', iText);
      item.style.display = 'none'
    }
  });
}

// //
// find and remove miniplayers
const killMiniPlayers = function() {
  const vc = document.getElementById('video-preview-container');
  if (vc) {
    vc.remove();
  }

  const mp = document.getElementsByTagName('ytd-miniplayer');
  if (mp.length > 0) {
    mp[0].remove();
  }

  const sp = document.getElementById('video-preview');
  if (sp) {
    sp.remove();
  }
  
  document.querySelectorAll('div#mouseover-overlay').forEach((d) => { d.remove(); });
  document.querySelectorAll('div#hover-overlays').forEach((d) => { d.remove(); });
};

// //
// find and remove live chat container
const hideLiveChat = function() {
  const chat = document.getElementById('chat-container');
  if (chat) {
    console.debug('[LS Filter] live chat found');
    chat.remove();
  }
  const panel = document.getElementById('panels-full-bleed-container');
  if (panel) {
    console.debug('[LS Filter] live chat container found');
    panel.remove();
  }
}

// //
// hide shorts
function hideShorts() {
  const els = [...document.querySelectorAll('[tab-title="Shorts"], [aria-label="Shorts"]')];
  els.forEach((el) => {
    if (el.style.display !== 'none') {
      console.debug('[LS Filter] hiding shorts link');
      el.style.display = 'none';
    }
  });

  // Hide section of shorts
  const sections = [...document.querySelectorAll('.ytd-reel-shelf-renderer, .ytd-rich-shelf-renderer')];
  sections.forEach((sec) => {
    if (sec.innerText.match(/Shorts/) && sec.parentElement.style.display !== 'none') {
      console.debug('[LS Filter] hiding shorts section');
      sec.parentElement.style.display = 'none';
    }
  });

  // Hide title with "Shorts"
  const pEls = [...document.querySelectorAll('[title="Shorts"]')];
  pEls.forEach((el) => {
    if (el.parentElement.style.display !== 'none') {
      console.debug('[LS Filter] hiding shorts title');
      el.parentElement.style.display = 'none';
    }
  });
}

// //
// post message to extension to score the embed
const scannedVideos = [];
function scoreEmbed() {
  let docUrl = window.location.href;
  if (docUrl.match(/\/embed\//)) {
    const titleEl = document.querySelector('.ytp-title-link');
    if (titleEl && titleEl.href) {
      docUrl = titleEl.href;
    }
    if (!scannedVideos.includes(docUrl)) {
      scannedVideos.push(docUrl);
      console.debug('[LS Filter] embed detected ->', docUrl);
      
      scoreUrl({ url: docUrl, type: 'youtube' }, (score) => {
        if (score.allow === 'blocked') {
          pauseVideo();
          const blockImage = `<img src="${blockImg}" style="width: 100%;">`;
          console.debug('[LS Filter] video blocked ->', score.url);
          document.body.innerHTML = blockImage;
        }
      });
    }
  }
}

async function unloadWorker() {
  await navigator.serviceWorker.getRegistrations().then(async (sw) => {
    if (sw.length > 0) {
      console.debug('[LS Filter] unregister worker');
      sw[0].unregister();
    }
  });
}

window.addEventListener('online', () => {
  console.debug('[LS Filter] online');
  location.reload(true);
});

window.addEventListener('beforeunload', async () => {
  console.debug('[LS Filter] cleanup');

  if (typeof(observer) !== 'undefined') {
    observer.disconnect();
  }

  await unloadWorker();
});

function youtubeLoaded() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      unloadWorker();
      configure();
    });
  } else {
    unloadWorker();
    configure();
  }
}
youtubeLoaded();

const blockImg = "/de1dd6262b4cd2e0f804676560486def500f151d7cfee5a343d36442c0bfd158/blocked-image-search.png";

let hardBlockPolicy;

function scoreUrl(body, callback) {
  const xhr = new XMLHttpRequest();
  const checkUrl = document.location.origin + '/de1dd6262b4cd2e0f804676560486def500f151d7cfee5a343d36442c0bfd158/log';
  xhr.open('POST', checkUrl, true);
  xhr.send(JSON.stringify(body));
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) { // Request completed
      if (this.status === 200 && xhr.responseText) {
        try {
          const score = JSON.parse(xhr.responseText);
          if (callback) {
            callback(score);
          } else {
            console.log('[LS Filter] score ->', score.allow);
            if (score.redirect) {
              window.location.href = score.redirect;
              hardBlock();
            }
          }
        } catch (err) {
          console.error('[LS Filter] error parsing score response ->', err);
          if (callback) {
            callback({ allow: 'error', error: err.message });
          }
        }
      } else {
        // HTTP error or empty response
        console.error('[LS Filter] score request failed ->', this.status, xhr.statusText);
        if (callback) {
          callback({ allow: 'error', error: `HTTP ${this.status}` });
        }
      }
    }
  };
  
  // Handle network errors
  xhr.onerror = function() {
    console.error('[LS Filter] score request network error');
    if (callback) {
      callback({ allow: 'error', error: 'network error' });
    }
  };
  
  // Handle timeout
  xhr.ontimeout = function() {
    console.error('[LS Filter] score request timeout');
    if (callback) {
      callback({ allow: 'error', error: 'timeout' });
    }
  };
}

function getHardBlockPolicy() {
  if (typeof(trustedTypes) !== 'undefined' && !hardBlockPolicy) {
    hardBlockPolicy = trustedTypes.createPolicy('hardBlock', {
      createHTML: (string) => string
    });
  }
  return hardBlockPolicy;
}

function hardBlock() {
  pauseVideo();
  const stopInt = setInterval(pauseVideo, 500);
  setTimeout(() => {
    const policy = getHardBlockPolicy();
    if (policy) {
      document.body.innerHTML = policy.createHTML(`<img src="${blockImg}" style="width: 100%; height: 100%">`);
    } else {
      document.body.innerHTML = `<img src="${blockImg}" style="width: 100%; height: 100%">`;
    }
    clearInterval(stopInt);
  }, 3000)
}

function pauseVideo() {
  const ea = document.getElementsByTagName('video');
  if (ea.length == 0) { return; }
  for (i in ea) {
    if (typeof(ea[i].pause) !== 'function') { continue; }
    console.debug('[LS Filter] paused ->', ea[i].paused);
    if (!ea[i].paused) {
      console.debug('[LS Filter] pause video');
      ea[i].pause();
    }
    const e = ea[i].closest('ytd-channel-video-player-renderer');
    if (e && e.style.display !== 'none') {
      console.debug('[LS Filter] hide autoplay container');
      e.style.display = 'none';
    }
  }
}

function onLoad() {
  console.log('[LS Filter] loaded');
  if (window.top === window.self) {
    console.log('[LS Filter] top window: ' + window.location.href);
    scoreUrl({ url: window.location.href }, false);
  }
}

onLoad();
